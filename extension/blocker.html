<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FocusBlocker</title>

    <link
        rel="stylesheet"
        href="blocker.css"
    >

</head>

<body>

<div class="page">

    <div class="shield">
        🛡️
    </div>

    <h1>
        Stay Focused.
    </h1>

    <p>
        This website is currently blocked
        by FocusBlocker.
    </p>

    <div class="message">

        <strong>
            You were about to get distracted.
        </strong>

        <span>
            Take a breath and get back to
            what matters.
        </span>

    </div>

    <button
        onclick="goBack()"
    >
        ← Go Back
    </button>

</div>

<script src="blocker.js"></script>

</body>

</html>
