<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FocusBlocker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="public-page">

        <div class="shield">
            🛡️
        </div>

        <h1>
            FocusBlocker
        </h1>

        <p>
            This device is protected from
            distracting websites.
        </p>

        <div class="blocked-sites">

            <div class="site">

                <span class="site-icon youtube">
                    ▶
                </span>

                <div>
                    <strong>
                        YouTube Shorts
                    </strong>

                    <small>
                        Blocked
                    </small>
                </div>

                <span class="blocked">
                    BLOCKED
                </span>

            </div>


            <div class="site">

                <span class="site-icon tiktok">
                    ♪
                </span>

                <div>
                    <strong>
                        TikTok
                    </strong>

                    <small>
                        Blocked
                    </small>
                </div>

                <span class="blocked">
                    BLOCKED
                </span>

            </div>

        </div>

        <p class="admin-note">
            Administrator access required to
            change blocking settings.
        </p>

        <a
            href="admin.html"
            class="admin-link"
        >
            Administrator Login
        </a>

    </main>

</body>

</html>
