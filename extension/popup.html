<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusBlocker</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

<div class="container">

    <header>
        <div class="logo">
            <div class="logo-icon">🛡️</div>

            <div>
                <h1>FocusBlocker</h1>
                <p>Stay focused. Stay productive.</p>
            </div>
        </div>

        <div id="status" class="status">
            ACTIVE
        </div>
    </header>


    <section class="focus-card">

        <div>
            <span class="small-title">FOCUS MODE</span>

            <h2 id="timer">
                00:00:00
            </h2>
        </div>

        <button id="focusButton">
            Start Focus
        </button>

    </section>


    <section>

        <h3>Blocked Websites</h3>

        <div class="website">

            <div class="site-info">
                <div class="site-icon youtube">▶</div>

                <div>
                    <strong>YouTube Shorts</strong>
                    <span>youtube.com/shorts</span>
                </div>
            </div>

            <label class="switch">
                <input
                    type="checkbox"
                    id="youtubeToggle"
                    checked
                >
                <span class="slider"></span>
            </label>

        </div>


        <div class="website">

            <div class="site-info">
                <div class="site-icon tiktok">♪</div>

                <div>
                    <strong>TikTok</strong>
                    <span>tiktok.com</span>
                </div>
            </div>

            <label class="switch">
                <input
                    type="checkbox"
                    id="tiktokToggle"
                    checked
                >
                <span class="slider"></span>
            </label>

        </div>

    </section>


    <section class="statistics">

        <div class="stat">
            <span id="blockedCount">0</span>
            <small>Blocked Today</small>
        </div>

        <div class="stat">
            <span id="focusMinutes">0</span>
            <small>Focus Minutes</small>
        </div>

    </section>


    <footer>
        <span>FocusBlocker v1.0</span>
        <span>🚀 Stay focused</span>
    </footer>

</div>

<script src="popup.js"></script>

</body>
</html>
