cat > website/index.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FocusBlocker Admin</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="container">

        <!-- LOGIN -->
        <section id="loginScreen" class="card">

            <div class="logo">🛡️</div>

            <h1>FocusBlocker</h1>

            <p class="subtitle">
                Administrator Login
            </p>

            <form id="loginForm">

                <input
                    id="username"
                    type="text"
                    placeholder="Username"
                    required
                >

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </section>


        <!-- DASHBOARD -->
        <section id="dashboard" class="card hidden">

            <div class="top">

                <div>
                    <div class="small-logo">🛡️</div>

                    <h1>FocusBlocker</h1>

                    <p class="subtitle">
                        Administrator Dashboard
                    </p>
                </div>

                <button
                    id="logoutButton"
                    class="logout"
                    type="button"
                >
                    Logout
                </button>

            </div>


            <div class="settings">

                <div class="setting">

                    <div>
                        <h3>Master Blocking</h3>

                        <p>
                            Enable website blocking.
                        </p>
                    </div>

                    <label class="switch">

                        <input
                            id="enabled"
                            type="checkbox"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="setting">

                    <div>
                        <h3>YouTube Shorts</h3>

                        <p>
                            Block YouTube Shorts.
                        </p>
                    </div>

                    <label class="switch">

                        <input
                            id="youtubeShorts"
                            type="checkbox"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="setting">

                    <div>
                        <h3>TikTok</h3>

                        <p>
                            Block TikTok.
                        </p>
                    </div>

                    <label class="switch">

                        <input
                            id="tiktok"
                            type="checkbox"
                        >

                        <span class="slider"></span>

                    </label>

                </div>

            </div>


            <button
                id="saveButton"
                class="save"
                type="button"
            >
                Save Settings
            </button>

            <p id="status"></p>

        </section>

    </main>


    <script src="./script.js"></script>

</body>
</html>
EOF
